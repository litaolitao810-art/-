<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理后台 · 野舟 AI</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="nav wrap"><a href="/" class="brand">◈ 野舟 AI</a><nav><a href="/">← 返回商城</a></nav></div></header><main class="wrap" style="max-width:850px;padding-top:50px;padding-bottom:80px"><h1>商店管理后台</h1><p class="notice">演示版后台。上线前必须设置强管理员密钥、HTTPS、正式身份验证和审计日志。不要将密钥发送给他人。</p><label>管理员密钥<input type="password" id="key" class="field" placeholder="本地默认密钥见 README"></label><button id="refresh" class="action">读取数据</button><div id="info"></div><h2>新增自营商品</h2><form id="form"><input class="field" name="name" placeholder="商品名称" required><input class="field" name="category" placeholder="分类" value="数字教程"><input class="field" name="description" placeholder="商品描述"><input class="field" name="price" type="number" step="0.01" min="0" placeholder="价格" required><input class="field" name="stock" type="number" min="0" placeholder="库存" required><textarea class="field" name="deliveryText" placeholder="付款后交付的文本或资源链接"></textarea><button class="action">上架商品</button></form><p id="message"></p></main><script>const $=s=>document.querySelector(s);async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'x-admin-key':$('#key').value,...opts.headers}}),d=await r.json();if(!r.ok)throw Error(d.error);return d}$('#refresh').onclick=async()=>{try{const d=await api('/api/admin/overview');$('#info').innerHTML='<h2>商品：'+d.products.length+' 件 · 订单：'+d.orders.length+' 笔</h2><pre>'+JSON.stringify({products:d.products.map(({codes,deliveryText,...p})=>p),orders:d.orders.map(({delivery,...o})=>o)},null,2).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</pre>'}catch(e){$('#info').textContent=e.message}};$('#form').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));v.price=Number(v.price);v.stock=Number(v.stock);try{await api('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});$('#message').textContent='商品已上架';$('#refresh').click()}catch(e){$('#message').textContent=e.message}};</script></body></html>
